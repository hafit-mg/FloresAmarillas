<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aunque estemos lejos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Karla:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#191036;
    --noche-2:#2b1a55;
    --petalo:#ffc63c;
    --petalo-luz:#ffe28c;
    --petalo-sombra:#e8890d;
    --centro:#5b3410;
    --semilla:#8a5220;
    --hoja:#4e8a56;
    --texto:#fdf3dd;
    --texto-tenue:#c9b8e8;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:
      radial-gradient(120% 90% at 50% 62%, #3a2468 0%, rgba(58,36,104,0) 62%),
      linear-gradient(180deg,#140c2c 0%, var(--noche) 45%, #241547 100%);
    color:var(--texto);
    font-family:"Karla","Trebuchet MS",system-ui,sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(1.4rem,4vh,2.8rem);
    padding:clamp(1.5rem,5vw,3rem) 1.25rem clamp(2rem,6vh,3.5rem);
    overflow-x:hidden;
  }

  /* ---------- mensaje ---------- */
  .mensaje{
    max-width:22ch;
    text-align:center;
    font-family:"Fraunces",Georgia,"Times New Roman",serif;
    font-weight:300;
    font-size:clamp(1.45rem,5.2vw,2.5rem);
    line-height:1.32;
    letter-spacing:-0.01em;
    text-wrap:balance;
    opacity:0;
    animation:entrar 1.6s ease-out .3s forwards;
  }

  .felicidad{
    display:block;
    margin-top:.55em;
    font-style:italic;
    font-weight:500;
    font-size:.92em;
    color:var(--petalo-luz);
  }

  /* ---------- girasol ---------- */
  .escena{
    position:relative;
    width:min(74vw,330px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
  }

  .resplandor{
    position:absolute;
    inset:-28%;
    background:radial-gradient(circle,rgba(255,198,60,.28) 0%,rgba(255,198,60,.09) 38%,transparent 66%);
    opacity:0;
    animation:entrar 2.4s ease-out 1.1s forwards;
  }

  .tallo{
    position:absolute;
    top:52%;
    left:50%;
    width:9px;
    height:46vh;
    margin-left:-4.5px;
    border-radius:6px;
    background:linear-gradient(180deg,#3f7a4a,#2c5c38);
    transform-origin:50% 0;
    transform:scaleY(0);
    animation:crecer 1.4s cubic-bezier(.22,.9,.3,1) .25s forwards;
  }

  .hoja{
    position:absolute;
    left:50%;
    width:74px;
    height:34px;
    background:linear-gradient(140deg,#66a86a,var(--hoja));
    border-radius:0 100% 0 100%;
    opacity:0;
    animation:entrar 1s ease-out 1.15s forwards;
  }
  .hoja--izq{top:22%;transform:translateX(-100%) rotate(14deg)}
  .hoja--der{top:36%;border-radius:100% 0 100% 0;transform:rotate(-14deg);transform-origin:left center}

  .flor{
    position:absolute;
    inset:0;
    animation:girar 20s linear 1.9s infinite;
  }

  .flor--interna{
    animation-duration:28s;
    animation-delay:2.4s;
  }

  .petalo{
    position:absolute;
    left:50%;
    top:50%;
    width:12.5%;
    height:46%;
    margin-left:-6.25%;
    background:linear-gradient(180deg,var(--petalo-luz) 0%,var(--petalo) 48%,var(--petalo-sombra) 100%);
    border-radius:60% 60% 26% 26% / 78% 78% 22% 22%;
    transform-origin:50% 100%;
    transform:translateY(-100%) rotate(var(--a)) scaleY(.04) scaleX(.4);
    opacity:0;
    animation:abrir .9s cubic-bezier(.2,1.5,.35,1) var(--d) forwards;
  }

  .petalo--interno{
    height:34%;
    width:10.5%;
    margin-left:-5.25%;
    background:linear-gradient(180deg,#fff0bb 0%,var(--petalo-luz) 55%,var(--petalo) 100%);
    filter:saturate(1.05);
  }

  .centro{
    position:absolute;
    left:50%;
    top:50%;
    width:36%;
    height:36%;
    margin:-18% 0 0 -18%;
    border-radius:50%;
    background:radial-gradient(circle at 38% 34%,#8a5a26 0%,var(--centro) 55%,#331c07 100%);
    box-shadow:inset 0 0 22px rgba(0,0,0,.55), 0 0 30px rgba(255,190,60,.22);
    transform:scale(0);
    animation:brotar .8s cubic-bezier(.3,1.6,.4,1) .55s forwards;
    overflow:hidden;
  }

  .semilla{
    position:absolute;
    width:5.5%;
    height:5.5%;
    border-radius:50%;
    background:var(--semilla);
    opacity:.75;
  }

  /* ---------- pie ---------- */
  .pie{
    font-size:.82rem;
    letter-spacing:.06em;
    color:var(--texto-tenue);
    opacity:0;
    animation:entrar 1.8s ease-out 2.2s forwards;
  }

  /* ---------- animaciones ---------- */
  @keyframes abrir{
    to{opacity:1;transform:translateY(-100%) rotate(var(--a)) scaleY(1) scaleX(1)}
  }
  @keyframes brotar{to{transform:scale(1)}}
  @keyframes crecer{to{transform:scaleY(1)}}
  @keyframes entrar{to{opacity:1}}
  @keyframes girar{to{transform:rotate(360deg)}}

  @media (max-width:480px){
    .tallo{height:34vh}
    .hoja{width:58px;height:27px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-delay:0ms !important;
      animation-iteration-count:1 !important;
    }
    .petalo,.mensaje,.pie,.resplandor,.hoja{opacity:1}
    .petalo{transform:translateY(-100%) rotate(var(--a))}
    .centro{transform:scale(1)}
    .tallo{transform:scaleY(1)}
  }
</style>
</head>
<body>

  <p class="mensaje">
    Aunque estemos lejos, mi forma de quererte nunca cambiará
    <span class="felicidad">¡Feliz día!</span>
  </p>

  <div class="escena">
    <div class="tallo"></div>
    <div class="hoja hoja--izq"></div>
    <div class="hoja hoja--der"></div>
    <div class="resplandor"></div>
    <div class="flor" id="flor"></div>
    <div class="flor flor--interna" id="florInterna"></div>
    <div class="centro" id="centro"></div>
  </div>

  <p class="pie">Día de las flores amarillas</p>

<script>
  const flor = document.getElementById('flor');
  const florInterna = document.getElementById('florInterna');
  const centro = document.getElementById('centro');

  // Pétalos: dos coronas que orbitan a distinta velocidad alrededor del centro
  function corona(capa, cantidad, desfase, clase, retrasoBase){
    for (let i = 0; i < cantidad; i++){
      const p = document.createElement('div');
      p.className = 'petalo' + (clase ? ' ' + clase : '');
      p.style.setProperty('--a', (i * 360 / cantidad + desfase) + 'deg');
      p.style.setProperty('--d', (retrasoBase + i * 0.055) + 's');
      capa.appendChild(p);
    }
  }

  corona(flor, 18, 0, '', 0.75);
  corona(florInterna, 13, 14, 'petalo--interno', 1.35);

  // Semillas en espiral de Fibonacci dentro del centro
  const dorado = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < 90; i++){
    const r = Math.sqrt(i / 90) * 44;           // radio en %
    const ang = i * dorado;
    const s = document.createElement('div');
    s.className = 'semilla';
    s.style.left = (50 + r * Math.cos(ang)) + '%';
    s.style.top  = (50 + r * Math.sin(ang)) + '%';
    s.style.transform = 'translate(-50%,-50%)';
    centro.appendChild(s);
  }
</script>
</body>
</html>
