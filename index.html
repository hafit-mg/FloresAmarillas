<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aunque estemos lejos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Karla:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#191036;
    --noche-2:#2b1a55;
    --petalo:#ffc63c;
    --petalo-luz:#ffe28c;
    --petalo-sombra:#e8890d;
    --centro:#5b3410;
    --semilla:#8a5220;
    --hoja:#4e8a56;
    --texto:#fdf3dd;
    --texto-tenue:#c9b8e8;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:
      radial-gradient(120% 90% at 50% 62%, #3a2468 0%, rgba(58,36,104,0) 62%),
      linear-gradient(180deg,#140c2c 0%, var(--noche) 45%, #241547 100%);
    color:var(--texto);
    font-family:"Karla","Trebuchet MS",system-ui,sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(1.4rem,4vh,2.8rem);
    padding:clamp(1.5rem,5vw,3rem) 1.25rem clamp(2rem,6vh,3.5rem);
    overflow-x:hidden;
  }

  /* ---------- mensaje ---------- */
  .mensaje{
    max-width:22ch;
    text-align:center;
    font-family:"Fraunces",Georgia,"Times New Roman",serif;
    font-weight:300;
    font-size:clamp(1.45rem,5.2vw,2.5rem);
    line-height:1.32;
    letter-spacing:-0.01em;
    text-wrap:balance;
    opacity:0;
    animation:entrar 1.6s ease-out .3s forwards;
  }

  .felicidad{
    display:block;
    margin-top:.55em;
    font-style:italic;
    font-weight:500;
    font-size:.92em;
    color:var(--petalo-luz);
  }

  /* ---------- girasol ---------- */
  .escena{
    position:relative;
    width:min(74vw,330px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
  }

  .resplandor{
    position:absolute;
    inset:-30%;
    background:radial-gradient(circle,rgba(255,198,60,.30) 0%,rgba(255,198,60,.10) 38%,transparent 66%);
    opacity:0;
    animation:
      entrar 2.4s ease-out 1.1s forwards,
      latido 5.5s ease-in-out 3.5s infinite;
  }

  .tallo{
    position:absolute;
    top:52%;
    left:50%;
    width:9px;
    height:46vh;
    margin-left:-4.5px;
    border-radius:6px;
    background:linear-gradient(180deg,#3f7a4a,#2c5c38);
    transform-origin:50% 0;
    transform:scaleY(0);
    animation:crecer 1.4s cubic-bezier(.22,.9,.3,1) .25s forwards;
  }

  .hoja{
    position:absolute;
    left:50%;
    width:74px;
    height:34px;
    background:linear-gradient(140deg,#66a86a,var(--hoja));
    border-radius:0 100% 0 100%;
    opacity:0;
    animation:entrar 1s ease-out 1.15s forwards;
  }
  .hoja--izq{top:22%;transform:translateX(-100%) rotate(14deg)}
  .hoja--der{top:36%;border-radius:100% 0 100% 0;transform:rotate(-14deg);transform-origin:left center}

  /* Cada capa de pétalos gira alrededor del centro.
     Las capas giran en sentidos opuestos y a distinta velocidad. */
  .flor{
    position:absolute;
    inset:0;
    animation:girar 14s linear infinite;
  }
  .flor--fondo{
    animation-duration:24s;
    animation-direction:reverse;
  }
  .flor--interna{
    animation-duration:18s;
    animation-direction:reverse;
  }

  /* Entrada: la capa sale del centro girando y crece hasta su tamaño */
  .entrada{
    position:absolute;
    inset:0;
    transform:rotate(-260deg) scale(.05);
    animation:llegar 2.4s cubic-bezier(.16,.9,.25,1) forwards;
  }
  .flor--fondo .entrada{animation-delay:.35s}
  .flor .entrada{animation-delay:.2s}
  .flor--interna .entrada{animation-delay:.6s}

  /* "Respiración" suave de cada capa */
  .pulso{
    position:absolute;
    inset:0;
    animation:respirar 6s ease-in-out 2.6s infinite;
  }
  .flor--fondo .pulso{animation-delay:3s;animation-duration:7.5s}
  .flor--interna .pulso{animation-delay:2.5s;animation-duration:5s}

  .petalo{
    position:absolute;
    left:50%;
    top:50%;
    width:var(--w,12.5%);
    height:var(--h,46%);
    margin-left:calc(var(--w,12.5%) / -2);
    background:
      linear-gradient(90deg,transparent 45%,rgba(140,70,0,.20) 50%,transparent 55%),
      linear-gradient(180deg,var(--petalo-luz) 0%,var(--petalo) 48%,var(--petalo-sombra) 100%);
    border-radius:60% 60% 26% 26% / 78% 78% 22% 22%;
    transform-origin:50% 100%;
    transform:translateY(-100%) rotate(var(--a)) skewX(var(--sk,0deg)) scale(.15,.02);
    opacity:0;
    animation:abrir .9s cubic-bezier(.2,1.5,.35,1) var(--d) forwards;
  }

  .petalo--fondo{
    background:
      linear-gradient(90deg,transparent 45%,rgba(90,40,0,.25) 50%,transparent 55%),
      linear-gradient(180deg,#ffd45a 0%,#f2a20f 55%,#c46a06 100%);
    filter:brightness(.92);
  }

  .petalo--interno{
    background:
      linear-gradient(90deg,transparent 45%,rgba(160,90,0,.16) 50%,transparent 55%),
      linear-gradient(180deg,#fff0bb 0%,var(--petalo-luz) 55%,var(--petalo) 100%);
    filter:saturate(1.05);
  }

  .centro{
    position:absolute;
    left:50%;
    top:50%;
    width:36%;
    height:36%;
    margin:-18% 0 0 -18%;
    border-radius:50%;
    background:radial-gradient(circle at 38% 34%,#8a5a26 0%,var(--centro) 55%,#331c07 100%);
    box-shadow:inset 0 0 22px rgba(0,0,0,.55), 0 0 30px rgba(255,190,60,.25);
    transform:scale(0);
    animation:brotar .8s cubic-bezier(.3,1.6,.4,1) .55s forwards;
    overflow:hidden;
  }

  .semillas{
    position:absolute;
    inset:0;
    animation:girar 70s linear 1.4s infinite reverse;
  }

  .semilla{
    position:absolute;
    width:5.5%;
    height:5.5%;
    border-radius:50%;
    background:var(--semilla);
    opacity:.75;
  }
  .semilla--clara{background:#b98240;opacity:.9}

  /* Motitas de polen que orbitan la flor */
  .orbita{
    position:absolute;
    inset:0;
    pointer-events:none;
    animation:girar var(--t,20s) linear infinite;
  }
  .polen{
    position:absolute;
    left:50%;
    width:var(--s,4px);
    height:var(--s,4px);
    margin-left:calc(var(--s,4px) / -2);
    border-radius:50%;
    background:var(--petalo-luz);
    box-shadow:0 0 8px 2px rgba(255,226,140,.65);
    opacity:0;
    animation:brillar 3.4s ease-in-out infinite;
  }

  /* ---------- pie ---------- */
  .pie{
    font-size:.82rem;
    letter-spacing:.06em;
    color:var(--texto-tenue);
    opacity:0;
    animation:entrar 1.8s ease-out 2.2s forwards;
  }

  /* ---------- animaciones ---------- */
  @keyframes abrir{
    to{opacity:1;transform:translateY(-100%) rotate(var(--a)) skewX(var(--sk,0deg)) scale(1,1)}
  }
  @keyframes llegar{
    to{transform:rotate(0deg) scale(1)}
  }
  @keyframes brotar{to{transform:scale(1)}}
  @keyframes crecer{to{transform:scaleY(1)}}
  @keyframes entrar{to{opacity:1}}
  @keyframes girar{to{transform:rotate(360deg)}}
  @keyframes respirar{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.045)}
  }
  @keyframes latido{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
  }
  @keyframes brillar{
    0%,100%{opacity:.1;transform:scale(.6)}
    50%{opacity:1;transform:scale(1.25)}
  }

  @media (max-width:480px){
    .tallo{height:34vh}
    .hoja{width:58px;height:27px}
  }

</style>
</head>
<body>

  <p class="mensaje">
    Aunque estemos lejos, mi forma de quererte nunca cambiará
    <span class="felicidad">¡Feliz día!</span>
  </p>

  <div class="escena">
    <div class="tallo"></div>
    <div class="hoja hoja--izq"></div>
    <div class="hoja hoja--der"></div>
    <div class="resplandor"></div>
    <div class="flor flor--fondo" id="florFondo"></div>
    <div class="flor" id="flor"></div>
    <div class="flor flor--interna" id="florInterna"></div>
    <div class="centro" id="centro"></div>
    <div id="polen"></div>
  </div>

  <p class="pie">Te quiere mucho Hafit</p>

<script>
  const florFondo = document.getElementById('florFondo');
  const flor = document.getElementById('flor');
  const florInterna = document.getElementById('florInterna');
  const centro = document.getElementById('centro');
  const polen = document.getElementById('polen');

  // Coronas de pétalos. "medidas" alterna largo/ancho para que el giro se note,
  // y "sk" inclina cada pétalo para dar efecto de remolino.
  function corona(capa, cantidad, desfase, clase, retrasoBase, medidas, sk){
    const entrada = document.createElement('div');
    entrada.className = 'entrada';
    capa.appendChild(entrada);
    const pulso = document.createElement('div');
    pulso.className = 'pulso';
    entrada.appendChild(pulso);

    for (let i = 0; i < cantidad; i++){
      const m = medidas[i % medidas.length];
      const p = document.createElement('div');
      p.className = 'petalo' + (clase ? ' ' + clase : '');
      p.style.setProperty('--a', (i * 360 / cantidad + desfase) + 'deg');
      p.style.setProperty('--d', (retrasoBase + i * 0.045) + 's');
      p.style.setProperty('--h', m[0] + '%');
      p.style.setProperty('--w', m[1] + '%');
      p.style.setProperty('--sk', sk + 'deg');
      pulso.appendChild(p);
    }
  }

  //          capa        n   desfase clase              retraso  [largo, ancho]            inclinación
  corona(florFondo,   16, 11,  'petalo--fondo',   0.35, [[50, 15]],                       -6);
  corona(flor,        18,  0,  '',                0.20, [[46, 12.5], [41, 11]],          -10);
  corona(florInterna, 13, 14,  'petalo--interno', 0.60, [[34, 10.5]],                     -8);

  // Semillas en espiral de Fibonacci dentro del centro (también giran, lento)
  const semillas = document.createElement('div');
  semillas.className = 'semillas';
  centro.appendChild(semillas);

  const dorado = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < 90; i++){
    const r = Math.sqrt(i / 90) * 44;           // radio en %
    const ang = i * dorado;
    const s = document.createElement('div');
    s.className = 'semilla' + (i % 7 === 0 ? ' semilla--clara' : '');
    s.style.left = (50 + r * Math.cos(ang)) + '%';
    s.style.top  = (50 + r * Math.sin(ang)) + '%';
    s.style.transform = 'translate(-50%,-50%)';
    semillas.appendChild(s);
  }

  // Polen brillante orbitando alrededor de la flor
  for (let i = 0; i < 26; i++){
    const radio = 54 + ((i * 37) % 26);          // distancia al centro en %
    const o = document.createElement('div');
    o.className = 'orbita';
    o.style.setProperty('--t', (16 + (i * 11) % 20) + 's');
    o.style.animationDelay = (-(i * 1.9)) + 's';
    if (i % 3 === 0) o.style.animationDirection = 'reverse';

    const d = document.createElement('span');
    d.className = 'polen';
    d.style.top = (50 - radio) + '%';
    d.style.setProperty('--s', (3 + (i % 3) * 1.8) + 'px');
    d.style.animationDelay = (2.4 + i * 0.22) + 's';

    o.appendChild(d);
    polen.appendChild(o);
  }
</script>
</body>
</html>
